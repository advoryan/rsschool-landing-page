<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
      name="description"
      content="Explore the coffee menu at Resource Coffee House."
   >
    <title>Resource Coffee House — Menu</title>
    <link rel="icon" href="assets/icons/logo.svg" type="image/svg+xml">
    <link
      rel="preload"
      href="assets/fonts/inter-regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
   >
    <link
      rel="preload"
      href="assets/fonts/inter-semibold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
   >
    <link rel="stylesheet" href="modern-normalize.css">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js"></script>
    <script src="catalog.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="header container">
      <a
        class="logo"
        href="index.html"
        aria-label="Resource Coffee House — home"
      >
        <img
          class="logo__light"
          src="assets/icons/logo.svg"
          alt=""
          width="100"
          height="60"
       >
        <img
          class="logo__dark"
          src="assets/icons/logo-dark.svg"
          alt=""
          width="100"
          height="60"
       >
      </a>
      <nav class="nav" id="navigation" aria-label="Main navigation">
        <ul class="nav__list">
          <li>
            <a class="nav__link" href="index.html#favorite">Favorite coffee</a>
          </li>
          <li><a class="nav__link" href="index.html#about">About</a></li>
          <li><a class="nav__link" href="index.html#mobile">Mobile app</a></li>
          <li><a class="nav__link" href="#contact">Contact us</a></li>
          <li class="nav__menu">
            <a class="nav__link nav__link--active" href="menu.html" aria-current="page"
              >Menu <span class="icon icon--coffee-cup" aria-hidden="true"></span
            ></a>
          </li>
        </ul>
      </nav>
      <div class="header__actions">
        <button
          class="theme-switch"
          type="button"
          aria-label="Dark theme"
          aria-pressed="false"
        >
          <span class="theme-switch__option theme-switch__option--light"
            ><span class="icon icon--sun" aria-hidden="true"></span
          ></span>
          <span class="theme-switch__option theme-switch__option--dark"
            ><span class="icon icon--moon" aria-hidden="true"></span
          ></span>
        </button>
        <a
          class="header__menu nav__link nav__link--active"
          href="menu.html"
          aria-current="page"
          >Menu <span class="icon icon--coffee-cup" aria-hidden="true"></span
        ></a>
        <button class="burger" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="navigation">
          <span class="burger__line"></span><span class="burger__line"></span>
        </button>
      </div>
    </header>
    <main class="menu container" id="main">
      <section class="catalog" aria-labelledby="menu-title">
        <h1 class="catalog__title" id="menu-title">
          Behind each of our cups hides an <em>amazing surprise</em>
        </h1>
        <div
          class="catalog__categories"
          role="group"
          aria-label="Menu categories"
        >
          <button
            class="category category--active"
            type="button"
            aria-pressed="true"
          >
            <span class="category__icon" aria-hidden="true">☕</span>Coffee
          </button>
          <button class="category" type="button" aria-pressed="false">
            <span class="category__icon" aria-hidden="true">🫖</span>Tea
          </button>
          <button class="category" type="button" aria-pressed="false">
            <span class="category__icon" aria-hidden="true">🍰</span>Dessert
          </button>
        </div>
        <p class="catalog__status" role="status">Loading products…</p>
        <noscript><p>Enable JavaScript to view the menu.</p></noscript>
        <div class="catalog__grid" aria-busy="true"></div>
        <template id="card-template">
          <article class="card">
            <div class="card__photo">
              <img class="card__image" alt="" width="340" height="340">
            </div>
            <div class="card__body">
              <h2 class="card__title"></h2>
              <p class="card__description"></p>
              <p class="card__price"></p>
            </div>
          </article>
        </template>
        <button
          class="round-button catalog__more"
          type="button"
          aria-label="Show more coffee"
          hidden
        >
          <span class="icon icon--refresh" aria-hidden="true"></span>
        </button>
      </section>
    </main>
    <footer class="footer container" id="contact">
      <div class="footer__offer">
        <h2 class="footer__title">
          Sip, Savor, Smile.<br><em>It’s coffee time!</em>
        </h2>
        <ul class="footer__socials" aria-label="Social networks">
          <li>
            <a
              class="round-button round-button--light"
              href="https://twitter.com/"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Twitter"
              ><span class="icon icon--twitter" aria-hidden="true"></span
            ></a>
          </li>
          <li>
            <a
              class="round-button round-button--light"
              href="https://www.instagram.com/"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Instagram"
              ><span class="icon icon--instagram" aria-hidden="true"></span
            ></a>
          </li>
          <li>
            <a
              class="round-button round-button--light"
              href="https://www.facebook.com/"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Facebook"
              ><span class="icon icon--facebook" aria-hidden="true"></span
            ></a>
          </li>
        </ul>
      </div>
      <div class="footer__contacts">
        <h3 class="footer__heading">Contact us</h3>
        <address class="footer__address">
          <a
            class="footer__link"
            href="https://www.google.com/maps/search/?api=1&amp;query=8558+Green+Rd+Los+Angeles"
            target="_blank"
            rel="noopener noreferrer"
            ><span class="icon icon--pin" aria-hidden="true"></span>8558 Green
            Rd.,&nbsp; LA</a
          >
          <a class="footer__link" href="tel:+16035550123"
            ><span class="icon icon--phone" aria-hidden="true"></span>+1&nbsp;(603)&nbsp;555&#8209;0123</a
          >
          <p class="footer__hours">
            <span class="icon icon--clock" aria-hidden="true"></span>Mon–Sat:
            9:00–23:00
          </p>
        </address>
      </div>
    </footer>
  </body>
</html>
